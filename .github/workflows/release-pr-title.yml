name: Release PR Title

on:
  pull_request:
    types:
      - opened
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

jobs:
  update-pr-title:
    name: Update PR Title
    if: >-
      github.event.pull_request.head.ref == 'develop' &&
      github.event.pull_request.base.ref == 'master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Update PR Title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { execSync } = require('child_process');

            const latestTag = execSync(
              'git tag --sort=-version:refname | head -n1',
              { encoding: 'utf8' }
            ).trim();

            core.info(`Latest tag: ${latestTag || '(none)'}`);

            let nextVersion;

            if (!latestTag) {
              nextVersion = '0.1.0';
            } else {
              const [major, minor, patch] = latestTag
                .split('.')
                .map(Number);

              nextVersion = `${major}.${minor}.${patch + 1}`;
            }

            core.info(`Next tag: ${nextVersion}`);

            const title = `chore(release): ${nextVersion}`;

            core.info(`Updating PR title to "${title}"`);

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              title,
            });
